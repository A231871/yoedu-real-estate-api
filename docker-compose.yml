version: '3.8'

services:
  postgres:
#    image: postgis/postgis:15-3.4
    build: .
    container_name: yoedu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: yoedu-real-estate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: yoedu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: