spring:
  application:
    name: yoedu-real-estate-api
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      listener:
        # Default false: prevents local dev startup crashes if Redis is not running.
        # Set REDIS_LISTENER_AUTO_STARTUP=true in production/staging environments.
        auto-startup: ${REDIS_LISTENER_AUTO_STARTUP:false}
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/yoedu-real-estate
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    clean-disabled: true
    baseline-on-migrate: true
    default-schema: public
    schemas: public
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  servlet:
    context-path: /api

app:
  jwt:
    issuer: estate-api
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 7
  viewing:
    buffer-minutes: 15
    cron:
      prompt-feedback: "0 */15 * * * *"
      auto-complete: "0 5 * * * *"
  ws:
    allowed-origins:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
    broker:
      # Set relay-enabled=true in production with a running RabbitMQ/ActiveMQ STOMP broker
      relay-enabled: false
      relay-host: ${BROKER_HOST:localhost}
      relay-port: ${BROKER_PORT:61613}
      relay-login: ${BROKER_LOGIN:guest}
      relay-passcode: ${BROKER_PASSCODE:guest}
  listing-views:
    redis-key-prefix: "views:count:"
    events-key-prefix: "views:events:"
    dedup-key-prefix: "views:dedup:"
    listing-cache-prefix: "listing:approved:"
    listing-cache-ttl-minutes: 15
    cron:
      flush: "0 */5 * * * *"