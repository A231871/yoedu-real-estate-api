spring:
  application:
    name: yoedu-real-estate-api
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/yoedu-real-estate
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

flyway:
  enabled: true
  baseline-on-migrate: true
  default-schema: public
  schemas: public
  locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

server:
  servlet:
    context-path: /api

app:
  jwt:
    issuer: estate-api
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 480
    refresh-token-ttl-days: 7
  viewing:
    buffer-minutes: 15
    cron:
      prompt-feedback: "0 */15 * * * *"
      auto-complete: "0 5 * * * *"
  listing-views:
    redis-key-prefix: "views:count:"
    events-key-prefix: "views:events:"
    dedup-key-prefix: "views:dedup:"
    listing-cache-prefix: "listing:approved:"
    listing-cache-ttl-minutes: 15
    cron:
      flush: "0 */5 * * * *"
